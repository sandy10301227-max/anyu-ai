<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安妤 AI｜超業教練</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f1f7;
  color:#292331;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;
}

.wrap{
  max-width:680px;
  margin:auto;
  padding:20px 16px 60px;
}

.hero{
  background:white;
  border-radius:28px;
  padding:28px 22px;
  margin-bottom:18px;
  box-shadow:0 8px 30px rgba(80,60,100,.08);
}

h1{
  margin:0;
  font-size:30px;
}

h2{
  margin:0 0 18px;
  font-size:23px;
}

.sub{
  color:#777;
  margin-top:8px;
}

.card{
  background:white;
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 8px 30px rgba(80,60,100,.07);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

button{
  border:0;
  border-radius:18px;
  padding:15px 12px;
  font-size:16px;
  font-weight:700;
  background:#f4eff8;
  color:#3c3150;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:#75518b;
  color:white;
}

input,textarea,select{
  width:100%;
  padding:15px;
  border:1px solid #ddd6e3;
  border-radius:16px;
  font-size:16px;
  margin-bottom:10px;
  background:white;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.hidden{
  display:none;
}

.reply{
  background:#f8f5fa;
  border-radius:18px;
  padding:16px;
  margin-top:10px;
  line-height:1.7;
}

.reply button{
  margin-top:10px;
  padding:9px 14px;
  font-size:14px;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.item:last-child{
  border-bottom:0;
}

.item span{
  flex:1;
}

.small{
  color:#888;
  font-size:14px;
}

.back{
  margin-bottom:14px;
  background:transparent;
  padding:5px;
  color:#75518b;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="hero">
    <h1>🤖 安妤 AI</h1>
    <div class="sub">你的超業 AI 教練｜陪你找客戶、回 LINE、做追蹤</div>
  </div>

  <!-- 首頁 -->
  <div id="home">

    <div class="card">
      <h2>今天想讓安妤 AI 幫你什麼？</h2>

      <div class="grid">
        <button onclick="show('crm')">👥 客戶 CRM</button>
        <button onclick="show('line')">💬 LINE 回覆</button>
        <button onclick="show('calendar')">📅 預約／活動</button>
        <button onclick="show('todo')">📝 今日待辦</button>
      </div>
    </div>

    <div class="card">
      <h2>🔥 教練提醒</h2>
      <p>
        不急著成交，先把客戶聊懂。<br>
        每一次聯絡，都留下下一步。
      </p>
    </div>

  </div>


  <!-- CRM -->
  <div id="crm" class="hidden">

    <button class="back" onclick="show('home')">← 回首頁</button>

    <div class="card">
      <h2>👥 客戶 CRM</h2>

      <input id="customerName" placeholder="客戶姓名／稱呼">
      <input id="customerRole" placeholder="身份，例如：老闆、朋友、同學">
      <input id="customerNeed" placeholder="目前需求，例如：房貸、資產活化">
      <textarea id="customerNote" placeholder="備註／客戶狀況"></textarea>

      <button class="primary" onclick="addCustomer()">
        ＋ 新增客戶
      </button>
    </div>

    <div class="card">
      <h2>我的客戶</h2>
      <div id="customerList"></div>
    </div>

  </div>


  <!-- LINE -->
  <div id="line" class="hidden">

    <button class="back" onclick="show('home')">← 回首頁</button>

    <div class="card">
      <h2>💬 LINE 人性回覆</h2>

      <p class="small">
        先選情境，安妤 AI 教練再幫你想話。
      </p>

      <select id="lineSituation" onchange="generateReplies()">
        <option value="">請選擇客戶情境</option>
        <option value="久沒聯絡">很久沒聯絡</option>
        <option value="已讀不回">客戶已讀不回</option>
        <option value="考慮">客戶說考慮一下</option>
        <option value="沒時間">客戶說沒時間</option>
        <option value="有興趣">客戶有興趣</option>
        <option value="拒絕">客戶婉拒</option>
      </select>

      <div id="replyList"></div>
    </div>

  </div>


  <!-- 預約 -->
  <div id="calendar" class="hidden">

    <button class="back" onclick="show('home')">← 回首頁</button>

    <div class="card">
      <h2>📅 預約／活動</h2>

      <input id="eventTitle" placeholder="活動名稱／客戶姓名">

      <input id="eventDate" type="date">

      <input id="eventTime" type="time">

      <button class="primary" onclick="addEvent()">
        ＋ 新增預約
      </button>
    </div>

    <div class="card">
      <h2>我的預約</h2>
      <div id="eventList"></div>
    </div>

  </div>


  <!-- 待辦 -->
  <div id="todo" class="hidden">

    <button class="back" onclick="show('home')">← 回首頁</button>

    <div class="card">
      <h2>📝 今日待辦</h2>

      <input id="todoInput" placeholder="例如：跟進王姐">

      <button class="primary" onclick="addTodo()">
        ＋ 新增待辦
      </button>
    </div>

    <div class="card">
      <div id="todoList"></div>
    </div>

  </div>

</div>


<script>

let customers =
JSON.parse(localStorage.getItem("customers") || "[]");

let todos =
JSON.parse(localStorage.getItem("todos") || "[]");

let events =
JSON.parse(localStorage.getItem("events") || "[]");


function show(page){

  ["home","crm","line","calendar","todo"]
  .forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });

  document.getElementById(page).classList.remove("hidden");

  if(page==="crm") renderCustomers();
  if(page==="todo") renderTodos();
  if(page==="calendar") renderEvents();
}


/* CRM */

function addCustomer(){

  const name=document.getElementById("customerName").value.trim();

  if(!name){
    alert("請先輸入客戶姓名／稱呼");
    return;
  }

  customers.push({
    name:name,
    role:document.getElementById("customerRole").value,
    need:document.getElementById("customerNeed").value,
    note:document.getElementById("customerNote").value
  });

  localStorage.setItem("customers",JSON.stringify(customers));

  document.getElementById("customerName").value="";
  document.getElementById("customerRole").value="";
  document.getElementById("customerNeed").value="";
  document.getElementById("customerNote").value="";

  renderCustomers();

  alert("客戶已新增！");
}


function renderCustomers(){

  const box=document.getElementById("customerList");

  if(customers.length===0){
    box.innerHTML='<p class="small">目前還沒有客戶。</p>';
    return;
  }

  box.innerHTML=customers.map((c,i)=>`

    <div class="item">
      <span>
        <b>${c.name}</b><br>
        <small>${c.role || ""} ${c.need || ""}</small>
      </span>

      <button onclick="deleteCustomer(${i})">刪除</button>
    </div>

  `).join("");
}


function deleteCustomer(i){

  if(confirm("確定要刪除這位客戶嗎？")){

    customers.splice(i,1);

    localStorage.setItem(
      "customers",
      JSON.stringify(customers)
    );

    renderCustomers();
  }
}


/* LINE */

function generateReplies(){

  const situation=
  document.getElementById("lineSituation").value;

  const replies={

    "久沒聯絡":[
      "嗨～突然想到你，最近過得還好嗎？😊",
      "好久沒跟你聊了，最近工作跟生活還順嗎？",
      "前陣子想到我們之前聊的事情，想說來關心你一下～最近有沒有什麼新的變化？"
    ],

    "已讀不回":[
      "我猜你最近應該比較忙，我先不打擾你～有空再跟我說一聲就好 😊",
      "沒關係，你忙你的，有需要我的時候再找我，我都在。",
      "我怕前面訊息被你忙到漏掉，所以再輕輕提醒一下～不用急著回。"
    ],

    "考慮":[
      "可以啊，這種事情本來就不用急著決定。你現在主要是在考慮哪一個部分？",
      "沒問題，你先想清楚比較重要。如果你願意，我可以陪你把疑慮整理一下。",
      "我懂，畢竟跟錢有關一定要想清楚。你最在意的是風險、資金，還是未來的安排？"
    ],

    "沒時間":[
      "我懂，大家現在真的都很忙 😂 那我不佔你時間，我只問你一個問題就好。",
      "沒關係，我知道你忙。那我們不用約很久，找一個你方便的時間聊一下就好。",
      "可以，我配合你的時間。你比較方便平日晚上，還是假日？"
    ],

    "有興趣":[
      "很好～那我先不急著跟你講方案，我想先了解你的狀況，這樣才不會亂推薦。",
      "可以，那我想先問你一件事：你現在最想解決的是哪一個問題？",
      "有興趣就好 😊 我們先聊你的需求，我再幫你看哪一種方式比較適合。"
    ],

    "拒絕":[
      "沒問題，我尊重你 😊 只是我想了解一下，是目前沒有需求，還是這件事情你比較擔心風險？",
      "了解，我不勉強你。以後如果你有任何房產或財務上的問題，都可以問我。",
      "OK，我懂。那我就先不打擾你，之後有需要再找我就好。"
    ]

  };

  const list=replies[situation] || [];

  document.getElementById("replyList").innerHTML=
  list.map((text,i)=>`

    <div class="reply">
      ${text}
      <br>
      <button onclick="copyText(${JSON.stringify(text)})">
        📋 複製
      </button>
    </div>

  `).join("");
}


function copyText(text){

  navigator.clipboard.writeText(text);

  alert("已複製，可以貼到 LINE 了！");
}


/* 待辦 */

function addTodo(){

  const input=document.getElementById("todoInput");
  const text=input.value.trim();

  if(!text) return;

  todos.push({
    text:text,
    done:false
  });

  localStorage.setItem(
    "todos",
    JSON.stringify(todos)
  );

  input.value="";

  renderTodos();
}


function renderTodos(){

  const box=document.getElementById("todoList");

  if(todos.length===0){
    box.innerHTML='<p class="small">今天還沒有待辦事項。</p>';
    return;
  }

  box.innerHTML=todos.map((t,i)=>`

    <div class="item">

      <input
        type="checkbox"
        style="width:22px;margin:0"
        ${t.done ? "checked" : ""}
        onchange="toggleTodo(${i})"
      >

      <span style="${t.done ? 'text-decoration:line-through;color:#999' : ''}">
        ${t.text}
      </span>

      <button onclick="deleteTodo(${i})">刪除</button>

    </div>

  `).join("");
}


function toggleTodo(i){

  todos[i].done=!todos[i].done;

  localStorage.setItem(
    "todos",
    JSON.stringify(todos)
  );

  renderTodos();
}


function deleteTodo(i){

  todos.splice(i,1);

  localStorage.setItem(
    "todos",
    JSON.stringify(todos)
  );

  renderTodos();
}


/* 預約 */

function addEvent(){

  const title=document.getElementById("eventTitle").value.trim();
  const date=document.getElementById("eventDate").value;
  const time=document.getElementById("eventTime").value;

  if(!title || !date || !time){
    alert("請把活動名稱、日期、時間填完整");
    return;
  }

  events.push({
    title:title,
    date:date,
    time:time
  });

  localStorage.setItem(
    "events",
    JSON.stringify(events)
  );

  document.getElementById("eventTitle").value="";

  renderEvents();

  alert("預約已建立！");
}


function renderEvents(){

  const box=document.getElementById("eventList");

  if(events.length===0){
    box.innerHTML='<p class="small">目前沒有預約。</p>';
    return;
  }

  box.innerHTML=events.map((e,i)=>`

    <div class="item">

      <span>
        <b>${e.title}</b><br>
        <small>${e.date} ${e.time}</small>
      </span>

      <button onclick="deleteEvent(${i})">刪除</button>

    </div>

  `).join("");
}


function deleteEvent(i){

  events.splice(i,1);

  localStorage.setItem(
    "events",
    JSON.stringify(events)
  );

  renderEvents();
}

</script>

</body>
</html>
