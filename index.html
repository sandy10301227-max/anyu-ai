<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>安妤 AI｜財富與房產活化助理</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#f6f1f7;

  color:#292331;

  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;

}

.wrap{

  padding:18px 16px 60px;

}

.card{

  background:#fff;

  padding:24px;

  margin-bottom:18px;

  box-shadow:0 6px 25px rgba(70,40,80,.06);

}

.hero{

  padding:28px 24px;

}

h1{

  font-size:30px;

  margin:0 0 20px;

}

h2{

  font-size:23px;

  margin:0 0 18px;

}

h3{

  margin:0 0 8px;

}

p{

  line-height:1.7;

}

.small{

  color:#81788a;

  font-size:14px;

}

.btn{

  border:0;

  border-radius:16px;

  padding:13px 18px;

  font-size:16px;

  font-weight:700;

  cursor:pointer;

}

.primary{

  background:#73508a;

  color:#fff;

}

.light{

  background:#f5eff7;

  color:#68477d;

}

.green{

  background:#dff8cf;

  color:#315b2c;

}

.red{

  background:#ffe8e8;

  color:#9a3b3b;

}

input,textarea,select{

  width:100%;

  padding:14px 15px;

  border:1px solid #ddd5e2;

  border-radius:15px;

  font-size:16px;

  margin-bottom:10px;

  background:#fff;

}

textarea{

  min-height:100px;

  resize:vertical;

}

.grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

}

.menuBtn{

  width:100%;

  min-height:72px;

  border:0;

  border-radius:20px;

  background:#f7f1f8;

  color:#0877df;

  font-size:18px;

  font-weight:800;

}

.menuBtn span{

  display:block;

  font-size:27px;

  margin-bottom:5px;

}

.hidden{

  display:none;

}

.replyBox{

  background:#faf7fb;

  border-radius:20px;

  padding:16px;

  margin-top:12px;

}

.reply{

  background:#fff;

  border:1px solid #eee5f0;

  border-radius:18px;

  padding:15px;

  margin:10px 0;

}

.replyTitle{

  font-weight:800;

  margin-bottom:8px;

}

.replyText{

  line-height:1.7;

}

.row{

  display:flex;

  gap:8px;

  align-items:center;

}

.row>*{

  flex:1;

}

.customer,

.todo,

.event{

  background:#faf8fb;

  padding:15px;

  border-radius:18px;

  margin-bottom:10px;

}

.done{

  opacity:.55;

  text-decoration:line-through;

}

  display:inline-block;

  background:#eee4f4;

  color:#704b82;

  border-radius:999px;

  padding:6px 10px;

  font-size:13px;

  margin:3px;

}

.back{

  margin-bottom:15px;

}

.empty{

  color:#999;

  text-align:center;

  padding:20px;

}

</style>

</head>

<body>

<div class="wrap">

  <!-- 首頁 -->

  <section id="home">

</div>

<script>

/* =========================

   基本頁面切換

========================= */

function showPage(page){

  document.querySelectorAll("section[id]").forEach(section=>{

    section.classList.add("hidden");

  });

  document.getElementById(page).classList.remove("hidden");

  if(page==="crm") renderCustomers();

  if(page==="todo") renderTodos();

  if(page==="calendar") renderEvents();

}

/* =========================

   客戶 CRM

========================= */

let customers =

JSON.parse(localStorage.getItem("anyu_customers") || "[]");

function saveCustomers(){

  localStorage.setItem(

    "anyu_customers",

    JSON.stringify(customers)

  );

}

function addCustomer(){

  const name =

    document.getElementById("customerName").value.trim();

  if(!name){

    alert("請先輸入客戶姓名");

    return;

  }

  const customer={

    id:Date.now(),

    name:name,

    phone:document.getElementById("customerPhone").value,

    type:document.getElementById("customerType").value,

    note:document.getElementById("customerNote").value

  };

  customers.unshift(customer);

  saveCustomers();

  document.getElementById("customerName").value="";

  document.getElementById("customerPhone").value="";

  document.getElementById("customerType").value="";

  document.getElementById("customerNote").value="";

  renderCustomers();

}

function deleteCustomer(id){

  if(!confirm("確定要刪除這位客戶嗎？")) return;

  customers =

    customers.filter(c=>c.id!==id);

  saveCustomers();

  renderCustomers();

}

function renderCustomers(){

  const box=document.getElementById("customerList");

  if(customers.length===0){

    box.innerHTML='<div class="empty">目前還沒有客戶</div>';

    return;

  }

  box.innerHTML=customers.map(c=>`

    <div class="customer">

      <h3>${escapeHtml(c.name)}</h3>

      ${c.type ? `<span class="tag">${escapeHtml(c.type)}</span>` : ""}

      ${c.phone ? `<p>📱 ${escapeHtml(c.phone)}</p>` : ""}

      ${c.note ? `<p>${escapeHtml(c.note)}</p>` : ""}

      <button class="btn red"

        onclick="deleteCustomer(${c.id})">

        刪除

      </button>

    </div>

  `).join("");

}

function showReplies(){

  const scenario=

    document.getElementById("scenario").value;

  const area=

    document.getElementById("replyArea");

  if(!scenario){

    area.innerHTML="";

    return;

  }

  const list=replies[scenario] || [];

  area.innerHTML=`

    <div class="replyBox">

      <div class="small">

        ${list.length} 種回覆方式

      </div>

      ${list.map((r,i)=>`

        <div class="reply">

          <div class="replyTitle">

            ${r.title}

          </div>

          <div class="replyText" id="reply-${i}">

            ${escapeHtml(r.text)}

          </div>

          <button

            class="btn light"

            onclick="copyReply(${i})">

            📋 複製

          </button>

        </div>

      `).join("")}

    </div>

  `;

  window.currentReplies=list;

}

function copyReply(index){

  const text=window.currentReplies[index].text;

  navigator.clipboard.writeText(text)

    .then(()=>{

      alert("已複製，可以直接貼到 LINE 👍");

    })

    .catch(()=>{

      prompt("請複製以下內容：",text);

    });

}

/* =========================

   Google 行事曆

========================= */

let events =

JSON.parse(localStorage.getItem("anyu_events") || "[]");

function saveEvents(){

  localStorage.setItem(

    "anyu_events",

    JSON.stringify(events)

  );

}

function addEvent(){

  const title=

    document.getElementById("eventTitle").value.trim();

  const date=

    document.getElementById("eventDate").value;

  const time=

    document.getElementById("eventTime").value;

  if(!title || !date || !time){

    alert("請至少填寫活動名稱、日期、時間");

    return;

  }

  const event={

    id:Date.now(),

    title:title,

    date:date,

    time:time,

    duration:parseInt(

      document.getElementById("eventDuration").value

    ) || 60,

    location:document.getElementById("eventLocation").value,

    note:document.getElementById("eventNote").value

  };

  events.unshift(event);

  saveEvents();

  document.getElementById("eventTitle").value="";

  document.getElementById("eventDate").value="";

  document.getElementById("eventTime").value="";

  document.getElementById("eventLocation").value="";

  document.getElementById("eventNote").value="";

  renderEvents();

}

function googleCalendarURL(event){

  const start =

    event.date.replace(/-/g,"") +

    "T" +

    event.time.replace(":","") +

    "00";

  const startDate=new Date(

    event.date+"T"+event.time

  );

  const endDate=

    new Date(

      startDate.getTime() +

      event.duration*60000

    );

  const end =

    endDate.getFullYear() +

    String(endDate.getMonth()+1).padStart(2,"0") +

    String(endDate.getDate()).padStart(2,"0") +

    "T" +

    String(endDate.getHours()).padStart(2,"0") +

    String(endDate.getMinutes()).padStart(2,"0") +

    "00";

  return "https://calendar.google.com/calendar/render?action=TEMPLATE"

    +"&text="+encodeURIComponent(event.title)

    +"&dates="+start+"/"+end

    +"&details="+encodeURIComponent(event.note || "")

    +"&location="+encodeURIComponent(event.location || "");

}

function deleteEvent(id){

  events=

    events.filter(e=>e.id!==id);

  saveEvents();

  renderEvents();

}

function renderEvents(){

  const box=document.getElementById("eventList");

  if(events.length===0){

    box.innerHTML='<div class="empty">目前還沒有活動</div>';

    return;

  }

  box.innerHTML=events.map(e=>`

    <div class="event">

      <h3>📅 ${escapeHtml(e.title)}</h3>

      <p>

        ${e.date} ${e.time}

        · ${e.duration} 分鐘

      </p>

      ${e.location

        ? `<p>📍 ${escapeHtml(e.location)}</p>`

        : ""}

      <a

        href="${googleCalendarURL(e)}"

        target="_blank"

        class="btn primary"

        style="display:inline-block;text-decoration:none">

        加入 Google 行事曆

      </a>

      <button

        class="btn red"

        onclick="deleteEvent(${e.id})">

        刪除

      </button>

    </div>

  `).join("");

}

/* =========================

   今日待辦

========================= */

let todos =

JSON.parse(localStorage.getItem("anyu_todos") || "[]");

function saveTodos(){

  localStorage.setItem(

    "anyu_todos",

    JSON.stringify(todos)

  );

}

function addTodo(){

  const input=

    document.getElementById("todoInput");

  const text=input.value.trim();

  if(!text) return;

  todos.unshift({

    id:Date.now(),

    text:text,

    done:false

  });

  saveTodos();

  input.value="";

  renderTodos();

}

function toggleTodo(id){

  const todo=

    todos.find(t=>t.id===id);

  if(todo) todo.done=!todo.done;

  saveTodos();

  renderTodos();

}

function deleteTodo(id){

  todos=

    todos.filter(t=>t.id!==id);

  saveTodos();

  renderTodos();

}

function renderTodos(){

  const box=document.getElementById("todoList");

  if(todos.length===0){

    box.innerHTML='<div class="empty">今天還沒有待辦事項 🎉</div>';

    return;

  }

  box.innerHTML=todos.map(t=>`

    <div class="todo ${t.done ? "done":""}">

      <div style="margin-bottom:10px">

        ${escapeHtml(t.text)}

      </div>

      <button

        class="btn green"

        onclick="toggleTodo(${t.id})">

        ${t.done ? "↩️ 取消完成" : "✅ 完成"}

      </button>

      <button

        class="btn red"

        onclick="deleteTodo(${t.id})">

        刪除

      </button>

    </div>

  `).join("");

}

/* =========================

   防止文字破壞 HTML

========================= */

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

</script>
